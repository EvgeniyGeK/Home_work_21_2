{% load static %}
<div class="col-md-3 col-lg-2 bg-dark text-white p-3 min-vh-100 d-flex flex-column">
    <h5>Меню</h5>
    <ul class="nav flex-column mb-auto">

        <li class="nav-item mb-2">
            <a href="{% url 'catalog:home' %}" class="nav-link text-white">🏠 Главная</a>
        </li>

        <li class="nav-item mb-2">
            <a href="{% url 'catalog:catalog' %}" class="nav-link text-white">📁 Категории</a>
        </li>

        <li class="nav-item mb-2">
            <a href="{% url 'catalog:orders' %}" class="nav-link text-white">📋 Заказы</a>
        </li>

        <li class="nav-item mb-2">
            <a href="{% url 'catalog:contacts' %}" class="nav-link text-white">📞 Контакты</a>
        </li>

        <li class="nav-item mb-2">
            <a href="{% url 'catalog:product_create' %}" class="nav-link text-warning fw-bold">➕ Добавить товар</a>
        </li>
        <li class="nav-item mb-2">
            <a href="{% url 'blog:list' %}" class="nav-link text-info">📰 Наш Блог</a>
        </li>
       <li class="list-unstyled"><hr class="text-secondary my-3"></li>
        {% if user.is_authenticated %}
            <li class="nav-item mb-2">
                <span class="nav-link text-success fw-bold">👤 {{ user.email }}</span>
            </li>
            <li class="nav-item mb-2">
                <form method="post" action="{% url 'users:logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-link nav-link text-danger p-0" style="text-decoration: none;">🚪 Выйти</button>
                </form>
            </li>
        {% else %}
            <li class="nav-item mb-2">
                <a href="{% url 'users:login' %}" class="nav-link text-white">🔑 Войти</a>
            </li>
            <li class="nav-item mb-2">
                <a href="{% url 'users:register' %}" class="nav-link text-white">📝 Регистрация</a>
            </li>
            <li class="nav-item mb-2">
                <a href="{% url 'users:profile' %}" class="nav-link text-white">⚙️ Настройки профиля</a>
            </li>
        {% endif %}
    </ul>
</div>
