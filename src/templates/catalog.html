{% extends 'base.html' %}

    <div class="row row-cols-1 row-cols-md-3 g-4 mt-2">

            <div class="card p-3 border-0 shadow-sm">

                <p class="small text-muted">Смартфоны, гаджеты и комплектующие.</p>
            </div>
        </div>
        <div class="col">
            <div class="card p-3 border-0 shadow-sm">
